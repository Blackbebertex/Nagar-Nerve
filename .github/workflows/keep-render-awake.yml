name: Keep Render API Awake

on:
  schedule:
    # Offset from the top of the hour to reduce scheduler congestion.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        run: curl --fail --silent --show-error --max-time 90 https://nagar-nerve-api-sqdy.onrender.com/api/health
